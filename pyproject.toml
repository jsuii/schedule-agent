[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "schedule-agent-local"
version = "0.1.0"
description = "中文日程 Agent：工具推理、安全确认、SQLite"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.3", "httpx==0.28.1", "pydantic==2.14.1", "python-dotenv==1.2.4", "uvicorn==0.54.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.1"]

[tool.setuptools.packages.find]
include = ["scheduler*"]
[tool.setuptools.package-data]
scheduler = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real LLM integration (RUN_LIVE_LLM=1); sends synthetic test data"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
